name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    if: github.ref_type == 'tag'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15
            platform: arm64
          - os: macos-15-intel
            platform: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and versions
        run: python scripts/check-release-version.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go test ./...
        working-directory: cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - if: runner.os != 'macOS'
        run: npm --prefix desktop run build -- --no-bundle
      - if: runner.os == 'macOS'
        run: npm --prefix desktop run build -- --bundles app
      - name: Build terminal controls
        shell: bash
        env:
          CGO_ENABLED: "0"
        run: |
          cd cli
          cli=nightfall
          if [[ $RUNNER_OS == Windows ]]; then cli+=.exe; fi
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "../$cli" .
      - if: runner.os == 'Windows'
        name: Build and test the Windows installer
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -Cli nightfall.exe -OutputDirectory release-assets
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/test-desktop.py "release-assets/Nightfall-$version-windows-x64-setup.exe"
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          mkdir -p release-assets
          if [[ $RUNNER_OS == Linux ]]; then
            ldd desktop/src-tauri/target/release/nightfall-renderer | tee /tmp/nightfall-libraries
            ! grep 'not found' /tmp/nightfall-libraries
            mkdir linux-package
            cp nightfall linux-package/
            cp desktop/src-tauri/target/release/nightfall-renderer linux-package/
            tar -czf "release-assets/Nightfall-$version-${{ matrix.platform }}.tar.gz" -C linux-package nightfall nightfall-renderer
          elif [[ $RUNNER_OS == Windows ]]; then
            python scripts/package-windows.py nightfall.exe desktop/src-tauri/target/release/nightfall-renderer.exe release-assets
            python scripts/test-desktop.py "release-assets/Nightfall-$version-windows-x64.zip"
          else
            app=desktop/src-tauri/target/release/bundle/macos/Nightfall.app
            cp nightfall "$app/Contents/MacOS/nightfall"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
            codesign --force --sign - nightfall
            mkdir mac-package
            cp -R "$app" mac-package/Nightfall.app
            cp nightfall mac-package/
            ditto -c -k --sequesterRsrc mac-package "release-assets/Nightfall-$version-${{ matrix.platform }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify archive set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          version=${GITHUB_REF_NAME#v}
          assets=(
            "Nightfall-$version-linux-x64.tar.gz"
            "Nightfall-$version-linux-arm64.tar.gz"
            "Nightfall-$version-arm64.zip"
            "Nightfall-$version-x64.zip"
            "Nightfall-$version-windows-x64.zip"
            "Nightfall-$version-windows-x64-setup.exe"
          )
          for asset in "${assets[@]}"; do test -s "$asset"; done
          sha256sum "${assets[@]}" > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" SHA256SUMS --verify-tag --title "Nightfall $version" --notes-file ../distribution/RELEASE-NOTES.md
