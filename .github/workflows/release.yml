name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
          - os: macos-15
            platform: arm64
          - os: macos-15-intel
            platform: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: go test ./...
        working-directory: cli
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Check tag and versions
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          for path in ['desktop/package.json', 'desktop/package-lock.json', 'desktop/src-tauri/tauri.conf.json']:
              assert json.load(open(path))['version'] == version, path
          assert f'name = "nightfall"\nversion = "{version}"' in open('desktop/src-tauri/Cargo.lock').read()
          assert f'version = "{version}"' in open('desktop/src-tauri/Cargo.toml').read()
          PY
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libgtk-layer-shell-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: npm ci
        working-directory: desktop
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
      - if: runner.os == 'Linux'
        run: npm --prefix desktop run build -- --no-bundle
      - if: runner.os == 'macOS'
        run: npm --prefix desktop run build -- --bundles app
      - name: Build terminal controls
        env:
          CGO_ENABLED: "0"
        run: |
          cd cli
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" -o ../nightfall .
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          mkdir release-assets
          if [[ $RUNNER_OS == Linux ]]; then
            ldd desktop/src-tauri/target/release/nightfall-renderer | tee /tmp/nightfall-libraries
            ! grep 'not found' /tmp/nightfall-libraries
            mkdir linux-package
            cp nightfall linux-package/
            cp desktop/src-tauri/target/release/nightfall-renderer linux-package/
            tar -czf "release-assets/Nightfall-$version-${{ matrix.platform }}.tar.gz" -C linux-package nightfall nightfall-renderer
          else
            app=desktop/src-tauri/target/release/bundle/macos/Nightfall.app
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$version"
            codesign --force --sign - nightfall
            mkdir mac-package
            cp -R "$app" mac-package/Nightfall.app
            cp nightfall mac-package/
            ditto -c -k --sequesterRsrc mac-package "release-assets/Nightfall-$version-${{ matrix.platform }}.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Verify archive set and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd release-assets
          version=${GITHUB_REF_NAME#v}
          test -s "Nightfall-$version-linux-x64.tar.gz"
          test -s "Nightfall-$version-linux-arm64.tar.gz"
          test -s "Nightfall-$version-arm64.zip"
          test -s "Nightfall-$version-x64.zip"
          sha256sum Nightfall-* > SHA256SUMS
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" Nightfall-* SHA256SUMS --verify-tag --title "Nightfall $version" --notes 'Terminal controls with Linux x64/ARM64 and Apple Silicon / Intel Mac. Linux needs GTK 3, WebKitGTK 4.1, gtk-layer-shell and AppIndicator; Hyprland is the primary target. Mac downloads are ad-hoc signed, not notarized. See the README for install and controls.'
