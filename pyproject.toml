[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nightfall-desktop"
version = "0.1.0"
description = "Independent native desktop snow for macOS and Hyprland"
requires-python = ">=3.11"
dependencies = [
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
]
[project.scripts]
nightfall = "nightfall.__main__:main"
[tool.setuptools.packages.find]
include = ["nightfall*"]
